name: Trigger TestFlight Build

on:
  schedule:
    - cron: '0 8 * * *'  # 08:00 UTC (09:00 Lisbon/WEST summer)

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch testflight.yml on develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run testflight.yml --ref develop
