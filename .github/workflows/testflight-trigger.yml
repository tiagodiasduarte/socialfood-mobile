name: Trigger TestFlight Nightly Build

on:
  schedule:
    - cron: '0 10 * * *'  # 10:00 UTC

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch testflight.yml on develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run testflight.yml --ref develop
