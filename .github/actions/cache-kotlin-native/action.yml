name: Cache Kotlin/Native
description: Caches the Kotlin/Native toolchain and its prebuilt platform library caches (~/.konan)

runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
        restore-keys: |
          konan-${{ runner.os }}-
