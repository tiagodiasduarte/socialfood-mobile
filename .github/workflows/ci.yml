name: 🧪 CI

on:
  pull_request:
    branches: [ develop, main ]

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.head.label || github.ref }}'
  cancel-in-progress: true

jobs:
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_CLIENT_ID_WEB: ${{ secrets.GOOGLE_CLIENT_ID_WEB }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
      GRADLE_OPTS: "-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx3g"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-google-services
        with:
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      - name: Set BUILD_DATE
        run: echo "BUILD_DATE=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV
      - run: ./gradlew :composeApp:assembleDebug --stacktrace

  android-test:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_CLIENT_ID_WEB: ${{ secrets.GOOGLE_CLIENT_ID_WEB }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
      GRADLE_OPTS: "-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx3g"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-google-services
        with:
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      - name: Set BUILD_DATE
        run: echo "BUILD_DATE=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV
      - run: ./gradlew :composeApp:testDebugUnitTest --stacktrace
      - run: ./gradlew :composeApp:koverHtmlReport --stacktrace
      - run: ./gradlew test -Pkover koverVerify --stacktrace
      - name: Upload Kover HTML report
        uses: actions/upload-artifact@v4
        with:
          name: kover-html-report
          path: composeApp/build/reports/kover/html/

  ios-build:
    name: iOS Build
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      GOOGLE_CLIENT_ID_WEB: ${{ secrets.GOOGLE_CLIENT_ID_WEB }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java
      - name: Create Secrets.xcconfig
        env:
          GOOGLE_CLIENT_ID_IOS: ${{ secrets.GOOGLE_CLIENT_ID_IOS }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > iosApp/Configuration/Secrets.xcconfig <<EOF
          GOOGLE_CLIENT_ID_WEB = ${GOOGLE_CLIENT_ID_IOS}
          GOOGLE_REVERSE_CLIENT_ID_WEB = com.googleusercontent.apps.$(echo ${GOOGLE_CLIENT_ID_IOS} | sed 's/.apps.googleusercontent.com//')
          EOF
          sed -i '' "s/TEAM_ID=/TEAM_ID=${TEAM_ID}/" iosApp/Configuration/Config.xcconfig
      - uses: ./.github/actions/setup-google-service-info-plist
        with:
          google-service-info-plist-base64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
      - run: sudo gem install cocoapods
      - run: cd iosApp && pod install
      - name: Select simulator destination
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("iPhone"))][0].udid')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Set BUILD_DATE
        run: echo "BUILD_DATE=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV
      - name: Build iOS app (Debug, simulator, unsigned)
        run: |
          cd iosApp
          xcodebuild build \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

  ios-test:
    name: iOS Unit Tests
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      GOOGLE_CLIENT_ID_WEB: ${{ secrets.GOOGLE_CLIENT_ID_WEB }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
      GRADLE_OPTS: "-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx3g"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-google-services
        with:
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      - name: Set BUILD_DATE
        run: echo "BUILD_DATE=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV
      - run: ./gradlew :composeApp:iosSimulatorArm64Test --stacktrace

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_CLIENT_ID_WEB: ${{ secrets.GOOGLE_CLIENT_ID_WEB }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
      GRADLE_OPTS: "-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx3g"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-google-services
        with:
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      - name: Set BUILD_DATE
        run: echo "BUILD_DATE=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV
      - run: ./gradlew ktlintCheck detekt :composeApp:lintDebug --stacktrace
      - name: Upload Ktlint HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-html-report
          path: composeApp/build/reports/ktlint/
      - name: Upload Detekt HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: detekt-html-report
          path: composeApp/build/reports/detekt/
      - name: Upload Lint HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-html-report
          path: composeApp/build/reports/lint-results-debug.html

  finish:
    name: 🏁 Finish
    if: ${{ !cancelled() }}
    needs:
      - android-build
      - android-test
      - ios-build
      - ios-test
      - static-analysis
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        name: Fail
        run: exit 1
