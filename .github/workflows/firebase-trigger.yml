name: Trigger Firebase Nightly Build

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch firebase.yml on develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run firebase.yml --ref develop
